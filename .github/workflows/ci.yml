name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: ./.github/actions/inkbox-sdk
      - name: Install frozen dependencies with the unreleased SDK artifact
        run: node tests/ci/install-sdk.mjs
      - run: pnpm check
      - run: pnpm pack:check
